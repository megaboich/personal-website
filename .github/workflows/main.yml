name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Version is taken from "packageManager" in package.json
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile

    - run: pnpm run typecheck

    - run: pnpm run build

    # Pushes to megaboich.github.io with an SSH deploy key (write access to that repo only)
    - name: Deploy
      if: github.event_name == 'push'
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh
        curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
        install -m 600 /dev/null ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
        pnpm run deploy:ga
